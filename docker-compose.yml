services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: microloan
      POSTGRES_USER: microloan
      POSTGRES_PASSWORD: microloan
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microloan -d microloan"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/microloan
      DB_USERNAME: microloan
      DB_PASSWORD: microloan
      JWT_SECRET: local-dev-secret-change-me-please-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
