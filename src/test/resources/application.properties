spring.application.name=microloan-platform

# --- Datasource (H2, Postgres-compatibility mode) ---
# Same Flyway migrations run here as against real Postgres in main -
# no separate test-only schema.
spring.datasource.url=jdbc:h2:mem:microloan_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=test-only-secret-key-not-used-anywhere-real-0123456789
jwt.expiration-ms=3600000

# A live 10s-interval poller running inside every cached @SpringBootTest context is a real
# source of test flakiness, not a hypothetical one - tests call the service methods directly.
app.scheduling.enabled=false
