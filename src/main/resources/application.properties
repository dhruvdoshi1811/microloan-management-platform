spring.application.name=microloan-platform

# --- Datasource (Postgres) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/microloan}
spring.datasource.username=${DB_USERNAME:microloan}
spring.datasource.password=${DB_PASSWORD:microloan}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Dev-only default secret below; override JWT_SECRET in every real environment.
jwt.secret=${JWT_SECRET:dev-only-secret-key-please-override-this-in-real-environments-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
